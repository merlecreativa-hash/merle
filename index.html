<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merlé | Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); min-height: 100vh; }
        .font-serif-custom { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.85); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04); }
        .glass-nav { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); }
        .ambient-light-1 { background: radial-gradient(circle, rgba(238,206,206,0.65) 0%, rgba(255,255,255,0) 70%); }
        .ambient-light-2 { background: radial-gradient(circle, rgba(206,220,238,0.65) 0%, rgba(255,255,255,0) 70%); }
        @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: floatSlow 6s ease-in-out infinite; }
    </style>
</head>
<body class="relative flex flex-col items-center min-h-screen p-6 text-slate-800">
    <div class="fixed -top-32 -left-32 w-96 h-96 ambient-light-1 rounded-full pointer-events-none"></div>
    <div class="fixed -bottom-32 -right-32 w-96 h-96 ambient-light-2 rounded-full pointer-events-none"></div>

    <header class="w-full max-w-4xl mb-12 z-20">
        <nav class="glass-nav rounded-full px-6 py-3 flex items-center justify-between shadow-sm">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-rose-50 border border-rose-100 flex items-center justify-center font-serif-custom font-bold text-rose-500">M</div>
                <span class="font-serif-custom text-xl font-bold text-slate-800">Merlé</span>
            </a>
            <div class="flex items-center gap-2">
                <a href="index.html" class="px-4 py-2 rounded-full text-sm font-medium bg-slate-900 text-white">Inicio</a>
                <a href="portfolio.html" class="px-4 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Portfolio</a>
                <a href="contacto.html" class="px-4 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Contacto</a>
            </div>
        </nav>
    </header>

    <main class="z-10 max-w-xl w-full my-auto">
        <div class="glass-card rounded-3xl p-8 md:p-12 text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 mb-8 rounded-full bg-rose-50 border border-rose-100 shadow-sm animate-float">
                <span class="font-serif-custom text-3xl font-bold text-rose-500">M</span>
            </div>
            <h1 class="font-serif-custom text-4xl sm:text-5xl md:text-6xl text-slate-900 mb-4">
                Hola, soy <span class="italic text-rose-500 font-semibold">Merlé</span>.
            </h1>
            <p class="text-slate-600 font-light text-lg sm:text-xl max-w-md mx-auto leading-relaxed mb-8">
                Bienvenido a mi rincón digital. Me apasiona crear, diseñar y compartir cosas hermosas.
            </p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="portfolio.html" class="w-full sm:w-auto px-7 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-full transition-all text-center">Ver Portfolio</a>
                <a href="contacto.html" class="w-full sm:w-auto px-7 py-3.5 bg-white/80 hover:bg-white text-slate-700 font-medium border border-slate-200/80 rounded-full transition-all text-center">Contacto</a>
            </div>
            <div class="mt-10 flex justify-center items-center gap-6 text-slate-400">
                <a href="#" class="hover:text-rose-500 text-sm font-medium">Instagram</a>
                <span class="text-xs text-slate-300">•</span>
                <a href="#" class="hover:text-rose-500 text-sm font-medium">Twitter</a>
                <span class="text-xs text-slate-300">•</span>
                <a href="#" class="hover:text-rose-500 text-sm font-medium">LinkedIn</a>
            </div>
        </div>
    </main>
</body>
</html>
