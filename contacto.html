<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merlé | Contacto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); min-height: 100vh; }
        .font-serif-custom { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.85); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04); }
        .glass-nav { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); }
        .custom-input { background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(226, 232, 240, 0.8); }
        .custom-input:focus { background: white; border-color: #f43f5e; outline: none; }
    </style>
</head>
<body class="relative flex flex-col items-center min-h-screen p-6 text-slate-800">
    <header class="w-full max-w-4xl mb-8 z-20">
        <nav class="glass-nav rounded-full px-6 py-3 flex items-center justify-between shadow-sm">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-rose-50 border border-rose-100 flex items-center justify-center font-serif-custom font-bold text-rose-500">M</div>
                <span class="font-serif-custom text-xl font-bold text-slate-800">Merlé</span>
            </a>
            <div class="flex items-center gap-2">
                <a href="index.html" class="px-4 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Inicio</a>
                <a href="portfolio.html" class="px-4 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Portfolio</a>
                <a href="contacto.html" class="px-4 py-2 rounded-full text-sm font-medium bg-slate-900 text-white">Contacto</a>
            </div>
        </nav>
    </header>

    <main class="z-10 max-w-xl w-full my-auto">
        <div class="glass-card rounded-3xl p-8">
            <h1 class="font-serif-custom text-3xl font-bold text-slate-900 mb-2 text-center">Contacto</h1>
            <p class="text-slate-600 text-sm text-center mb-6 font-light">Envíame un mensaje y conversemos sobre tu idea.</p>
            
            <form onsubmit="alert('¡Mensaje enviado!'); return false;" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre</label>
                    <input type="text" required placeholder="Tu nombre" class="w-full px-4 py-3 rounded-2xl text-sm custom-input">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                    <input type="email" required placeholder="tu@email.com" class="w-full px-4 py-3 rounded-2xl text-sm custom-input">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Mensaje</label>
                    <textarea rows="4" required placeholder="Escribe tu mensaje..." class="w-full px-4 py-3 rounded-2xl text-sm custom-input resize-none"></textarea>
                </div>
                <button type="submit" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-2xl transition-all text-sm">Enviar Mensaje</button>
            </form>
        </div>
    </main>
</body>
</html>
